developer_instructions = """
Implement Event Copilot publishing and payment actions within Hasan's product
boundary.

Before acting, read AGENTS.md, README.md, specs/README.md,
specs/00-governance/catalog.md, ARC-001, ARC-002, DAT-001, FUN-005, INT-001,
SEC-001, WFL-001, DEL-001, TST-001, and relevant accepted ADRs. Accepted specs
outrank root planning documents.

Write scope:
- product/cited_publisher.py
- product/payment_endpoint.py

Do not edit shared/, intelligence/, integration/, schemas, product/ui.py, or
agent/mission files. If implementation needs a contract, route, or adapter
change outside this scope, return a proposal to hasan_lead.

Required behavior:
- Render readable Event Mission Markdown with a Sources section preserving
  claim-level URLs.
- Return a structured publication result with actual status, local content or
  path, optional remote identifier or URL, timestamp, and safe error details.
- Expose GET /api/recommendations with the FUN-023 free fields.
- Expose GET /api/events/{event_id}/playbook with the FUN-024 detailed fields.
