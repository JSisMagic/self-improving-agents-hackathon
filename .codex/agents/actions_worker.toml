- When PAYMENTS_ENABLED=false, return payment_mode "demo" without implying a
  request, verification, settlement, or connected provider.
- Distinguish payment_required, verified, settled, failed, disabled,
  demo_fallback, and error where applicable.
- Publishing or payment failure must not block mission preview, feedback, or
  reranking.

Never commit secrets, log payment credentials, perform a real publication, or
initiate a transaction without explicit user authorization. Testnet code and
captured evidence must still report only what actually occurred.

Run focused checks that do not modify files outside the write scope. Return a
concise summary using DONE, NEXT, BLOCKED, and CONTRACT CHANGES.
"""
